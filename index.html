<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi Thảo</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Dancing+Script:wght@600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{--bg:#fdeff4;--ink:#3a1442;--soft:#7a4f86;--rose:#e8316f;--card:#fff;--line:#f3c6d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0e24;--ink:#fbe6ef;--soft:#c9a3d4;--rose:#ff6b9a;--card:#2c1736;--line:#4d2a5b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
main{width:100%;max-width:440px;padding:28px 20px 48px}
h1{font:700 44px/1.1 "Dancing Script","Segoe Script",cursive;margin:0 0 8px;color:var(--rose)}
.sub{color:var(--soft);margin:0 0 20px}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
textarea{min-height:110px;resize:vertical}
button{font:600 16px "Be Vietnam Pro",system-ui,sans-serif;border:0;border-radius:999px;padding:13px 26px;cursor:pointer;background:var(--rose);color:#fff}
button.ghost{background:transparent;color:var(--soft);border:1.5px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.out{margin-top:24px;background:var(--card);border:1.5px dashed var(--rose);border-radius:14px;padding:14px;word-break:break-all;font-size:13px}
.hide{display:none!important}
#view{text-align:center}
#c{display:block;width:100%;height:230px}
#lock .to,#done h2{font:700 34px/1.2 "Dancing Script",cursive;color:var(--rose);margin:0}
#hint{font-weight:600;margin:6px 0 16px}
#pin{max-width:220px;text-align:center;font-size:32px;letter-spacing:.5em;padding-left:.5em;margin:0 auto;display:block}
#err{color:var(--rose);min-height:1.6em;margin:10px 0 0;font-size:14px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#pic{display:block;width:60%;max-width:200px;aspect-ratio:1;object-fit:cover;border-radius:24px;margin:0 auto 16px;border:4px solid var(--card);box-shadow:0 8px 30px rgba(232,49,111,.28)}
#msg{font-size:19px;line-height:1.7;margin:10px 0 8px;min-height:3.4em;white-space:pre-wrap}
#ask{font:700 38px/1.15 "Dancing Script",cursive;color:var(--rose);margin:16px 0 24px}
.btns{display:flex;gap:16px;justify-content:center;align-items:center;min-height:90px}
#yes{transition:transform .25s}
#no{background:var(--card);color:var(--soft);border:1.5px solid var(--line)}
#mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:44px;height:44px;padding:0;font-size:20px;background:var(--card);color:var(--rose);border:1.5px solid var(--line);z-index:20}
#mus.off{opacity:.5}
.fw{display:inline-block;opacity:0;transform-origin:50% 100%;animation:fall 1s cubic-bezier(.2,.85,.3,1.25) forwards;animation-delay:var(--dl)}
@keyframes fall{0%{opacity:0;transform:translate3d(var(--x),-220px,320px) rotateX(-85deg) rotateZ(var(--z))}50%{opacity:1}100%{opacity:1;transform:none}}
.bq{display:block;width:230px;max-width:70%;margin:6px auto 0;overflow:visible;transform-origin:50% 95%;animation:sway 4s ease-in-out 3s infinite}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.stem{fill:none;stroke:#3d9a5f;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out forwards;animation-delay:var(--d)}
@keyframes draw{to{stroke-dashoffset:0}}
.bloom,.leaf{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .8s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:var(--d)}
@keyframes pop{to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.stem,.bloom,.leaf,.bq{animation:none;stroke-dashoffset:0;transform:none}}
.heart{position:fixed;bottom:-30px;pointer-events:none;color:var(--rose);animation:up var(--d) linear forwards;z-index:9}
@keyframes up{to{transform:translateY(-115vh) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.heart{animation-duration:.01s}}
</style>
</head>
<body>
<main>
  <section id="make">
    <h1>Viết lời tỏ tình</h1>
    <p class="sub">Người nhận phải nhập đúng mật mã 4 số mới đọc được lời nhắn.</p>
    <label for="to">Tên người nhận</label><input id="to" maxlength="40" placeholder="Ví dụ: Lan">
    <label for="from">Tên của bạn</label><input id="from" maxlength="40" placeholder="Ví dụ: Hùng">
    <label for="hint">Câu hỏi gợi ý (người nhận sẽ thấy)</label><input id="hint" maxlength="80" placeholder="Ví dụ: Ngày mình gặp nhau (ngày/tháng, 4 số)?">
    <label for="setpin">Mật mã (đúng 4 số)</label><input id="setpin" inputmode="numeric" maxlength="4" placeholder="0000">
    <label for="text">Lời nhắn</label><textarea id="text" maxlength="500" placeholder="Từ lúc quen em, mỗi ngày của anh đều vui hơn..."></textarea>
    <label for="q">Câu hỏi cuối</label><input id="q" maxlength="60" value="Làm người yêu anh nhé?">
    <div class="row"><button id="gen">Tạo link</button><button id="prev" class="ghost">Xem thử</button></div>
    <div id="out" class="out hide"><div id="link"></div><div class="row"><button id="copy">Sao chép link</button></div></div>
  </section>

  <section id="view" class="hide">
    <canvas id="c"></canvas>
    <div id="lock">
      <p class="to" id="hello"></p>
      <p class="sub">Nhập mật mã 4 số để mở lời nhắn</p>
      <div id="hint2"></div>
      <input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Mật mã 4 số">
      <p id="err"></p>
    </div>
    <div id="ask-wrap" class="hide">
      <img id="pic" class="hide" alt="" src="anh.jpg">
      <div id="msg"></div>
      <div id="ask"></div>
      <div class="btns"><button id="yes">Đồng ý</button><button id="no">Không</button></div>
    </div>
    <div id="done" class="hide">
      <svg class="bq" viewBox="0 0 240 280" aria-hidden="true">
        <defs><g id="fl"><g fill="currentColor" stroke="rgba(0,0,0,.1)"><ellipse cx="0" cy="-14" rx="8" ry="13"/><ellipse cx="0" cy="-14" rx="8" ry="13" transform="rotate(60)"/><ellipse cx="0" cy="-14" rx="8" ry="13" transform="rotate(120)"/><ellipse cx="0" cy="-14" rx="8" ry="13" transform="rotate(180)"/><ellipse cx="0" cy="-14" rx="8" ry="13" transform="rotate(240)"/><ellipse cx="0" cy="-14" rx="8" ry="13" transform="rotate(300)"/></g><circle r="7" fill="#ffd36b"/></g></defs>
        <path class="stem" pathLength="1" style="--d:.2s" d="M120 250C120 180 120 120 120 62"/>
        <path class="stem" pathLength="1" style="--d:.4s" d="M120 250C110 200 85 140 68 106"/>
        <path class="stem" pathLength="1" style="--d:.6s" d="M120 250C130 200 155 140 172 106"/>
        <path class="stem" pathLength="1" style="--d:.8s" d="M120 250C115 210 100 175 92 146"/>
        <path class="stem" pathLength="1" style="--d:1s" d="M120 250C125 210 140 175 148 146"/>
        <g transform="rotate(-35 98 196)"><ellipse class="leaf" style="--d:1.1s" cx="98" cy="196" rx="15" ry="6" fill="#4cb36f"/></g>
        <g transform="rotate(35 142 196)"><ellipse class="leaf" style="--d:1.2s" cx="142" cy="196" rx="15" ry="6" fill="#4cb36f"/></g>
        <path d="M72 200L168 200L134 266L106 266Z" fill="#ff6b9a"/><path d="M72 200L168 200L161 214L79 214Z" fill="#ffb3c7"/>
        <g fill="#fff"><ellipse cx="108" cy="240" rx="10" ry="5" transform="rotate(-20 108 240)"/><ellipse cx="132" cy="240" rx="10" ry="5" transform="rotate(20 132 240)"/><circle cx="120" cy="241" r="5"/></g>
        <g transform="translate(120 56) scale(1.1)" style="color:#ff6b9a"><g class="bloom" style="--d:1.3s"><use href="#fl"/></g></g>
        <g transform="translate(68 100) scale(.95)" style="color:#ffb3c7"><g class="bloom" style="--d:1.5s"><use href="#fl"/></g></g>
        <g transform="translate(172 100) scale(.95)" style="color:#c79bff"><g class="bloom" style="--d:1.7s"><use href="#fl"/></g></g>
        <g transform="translate(92 142) scale(.85)" style="color:#ffcf8a"><g class="bloom" style="--d:1.9s"><use href="#fl"/></g></g>
        <g transform="translate(148 142) scale(.85)" style="color:#ff8fab"><g class="bloom" style="--d:2.1s"><use href="#fl"/></g></g>
      </svg>
      <h2 id="thanks"></h2><p class="sub" id="who"></p>
    </div>
  </section>
</main>
<audio id="bgm" src="nhac.mp3" loop preload="auto"></audio>
<button id="mus" class="hide" aria-label="Bật hoặc tắt nhạc">♪</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},te=new TextEncoder(),td=new TextDecoder(),preview=false;
  function b2s(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function s2b(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function pack(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
  function unpack(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}
  function key(pin,salt,use){return crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,[use])})}
  function build(d){
    var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    return key(d.pin,salt,'encrypt').then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,te.encode(JSON.stringify({f:d.from,t:d.text,q:d.q})))})
    .then(function(ct){return {to:d.to,h:d.hint,s:b2s(salt),i:b2s(iv),c:b2s(new Uint8Array(ct))}});
  }
  function unlock(p,pin){return key(pin,s2b(p.s),'decrypt').then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:s2b(p.i)},k,s2b(p.c))}).then(function(b){return JSON.parse(td.decode(b))})}

  /* ---- 3D heart ---- */
  var H={locked:true,fast:false,big:false,init:false};
  function initHeart(){
    if(H.init||!window.THREE)return;H.init=true;
    var c=$('c'),r=new THREE.WebGLRenderer({canvas:c,alpha:true,antialias:true});
    r.setPixelRatio(Math.min(devicePixelRatio,2));
    var sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,100);cam.position.z=7;
    var s=new THREE.Shape();
    s.moveTo(25,25);s.bezierCurveTo(25,25,20,0,0,0);s.bezierCurveTo(-30,0,-30,35,-30,35);
    s.bezierCurveTo(-30,55,-10,77,25,95);s.bezierCurveTo(60,77,80,55,80,35);
    s.bezierCurveTo(80,35,80,0,50,0);s.bezierCurveTo(35,0,25,25,25,25);
    var g=new THREE.ExtrudeGeometry(s,{depth:22,bevelEnabled:true,bevelThickness:14,bevelSize:11,bevelSegments:14,curveSegments:28});
    g.center();g.rotateZ(Math.PI);
    var m=new THREE.MeshStandardMaterial({color:0x6b4a78,roughness:.28,metalness:.15}),mesh=new THREE.Mesh(g,m);
    sc.add(mesh);sc.add(new THREE.AmbientLight(0xffffff,.65));
    var dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(3,4,6);sc.add(dl);
    var pl=new THREE.PointLight(0xff9ec4,.9);pl.position.set(-4,-2,4);sc.add(pl);
    function size(){var w=c.clientWidth,h=c.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
    size();addEventListener('resize',size);
    var ry=0,sk=.034,tint=new THREE.Color();
    (function loop(t){
      requestAnimationFrame(loop);var x=t/1000;
      var b=Math.pow(Math.abs(Math.sin(x*(H.locked?1.2:2.6))),6);
      var target=sk*(1+(H.locked?.03:.08)*b)*(H.big?1.3:1);
      mesh.scale.setScalar(mesh.scale.x+(target-mesh.scale.x)*.2||target);
      ry=H.fast?ry+.07:ry+(Math.sin(x*.7)*.9-ry)*.1;mesh.rotation.y=ry;
      tint.set(H.locked?0x6b4a78:0xff2d6f);m.color.lerp(tint,.06);
      r.render(sc,cam);
    })(0);
  }

  /* ---- 3D falling text ---- */
  function fall(el,text,delay){
    el.textContent='';el.style.perspective='700px';
    var rm=matchMedia('(prefers-reduced-motion:reduce)').matches,n=0;
    text.split('\n').forEach(function(line,li){
      if(li)el.appendChild(document.createElement('br'));
      line.split(/\s+/).filter(Boolean).forEach(function(w){
        var s=document.createElement('span');s.className='fw';s.textContent=w;
        s.style.setProperty('--dl',(delay+n*.09)+'s');
        s.style.setProperty('--x',(Math.random()*80-40)+'px');
        s.style.setProperty('--z',(Math.random()*50-25)+'deg');
        if(rm){s.style.animation='none';s.style.opacity=1}
        el.appendChild(s);el.appendChild(document.createTextNode(' '));n++;
      });
    });
    return delay+n*.09+.9;
  }

  /* ---- music ---- */
  var bgm=$('bgm'),mus=$('mus');
  bgm.addEventListener('pause',function(){mus.classList.add('off')});
  bgm.addEventListener('play',function(){mus.classList.remove('off')});
  mus.onclick=function(){if(bgm.paused){bgm.play().catch(function(){})}else{bgm.pause()}};
  function startMusic(){
    if(bgm.readyState<2){bgm.addEventListener('canplay',startMusic,{once:true});return}
    mus.classList.remove('hide');var p=bgm.play();
    if(p&&p.catch)p.catch(function(){mus.classList.add('off');
      var f=function(e){if(e.target===mus)return;bgm.play().catch(function(){});document.removeEventListener('pointerdown',f)};
      document.addEventListener('pointerdown',f)});
  }
  var pic=$('pic');pic.onload=function(){pic.classList.remove('hide')};
  if(pic.complete&&pic.naturalWidth>0)pic.classList.remove('hide');

  /* ---- creator ---- */
  function read(){return {to:$('to').value.trim(),from:$('from').value.trim(),hint:$('hint').value.trim(),pin:$('setpin').value.trim(),text:$('text').value.trim(),q:$('q').value.trim()||'Làm người yêu anh nhé?'}}
  function ok(d){
    if(!window.crypto||!crypto.subtle){alert('Trình duyệt cần mở trang bằng https (ví dụ link github.io) mới tạo được mật mã.');return false}
    if(!d.to||!d.text||!d.hint||!/^\d{4}$/.test(d.pin)){alert('Hãy điền tên người nhận, câu hỏi gợi ý, lời nhắn và mật mã đúng 4 số.');return false}
    return true;
  }
  $('gen').onclick=function(){var d=read();if(!ok(d))return;
    build(d).then(function(p){var u=location.href.split('#')[0]+'#'+pack(p);$('link').textContent=u;$('out').dataset.url=u;$('out').classList.remove('hide')})};
  $('copy').onclick=function(){
    var b=$('copy');
    function sel(){var r=document.createRange();r.selectNodeContents($('link'));var s=getSelection();s.removeAllRanges();s.addRange(r)}
    try{navigator.clipboard.writeText($('out').dataset.url).then(function(){b.textContent='Đã sao chép';setTimeout(function(){b.textContent='Sao chép link'},1800)},sel)}catch(e){sel()}
  };
  $('prev').onclick=function(){var d=read();if(!ok(d))return;preview=true;build(d).then(showLock)};

  /* ---- recipient ---- */
  function showLock(p){
    $('make').classList.add('hide');$('view').classList.remove('hide');initHeart();
    fall($('hello'),'🔒 Gửi '+p.to+',',0);$('hint2').innerHTML='';
    var h=document.createElement('p');h.id='hint';$('hint2').appendChild(h);fall(h,p.h,.5);
    var pin=$('pin');pin.focus();
    pin.oninput=function(){
      pin.value=pin.value.replace(/\D/g,'');$('err').textContent='';
      if(pin.value.length<4)return;
      var v=pin.value;pin.disabled=true;
      unlock(p,v).then(open).catch(function(){
        $('err').textContent='Chưa đúng rồi, thử lại nhé';pin.disabled=false;pin.value='';pin.classList.add('shake');
        setTimeout(function(){pin.classList.remove('shake')},400);pin.focus();
      });
    };
  }
  var dodges=0,lines=['Không','Chắc chưa?','Nghĩ lại đi','Đừng mà','Đừng vậy mà','Anh buồn đó','Thôi bấm Đồng ý đi'];
  function open(d){
    H.locked=false;$('lock').classList.add('hide');$('ask-wrap').classList.remove('hide');startMusic();
    var fin=d.f?('Từ giờ có '+d.f+' ở đây rồi.'):'Từ giờ không còn một mình nữa.';
    var endMsg=fall($('msg'),d.t,.3);fall($('ask'),d.q,endMsg+.2);
    var yes=$('yes'),no=$('no');
    function dodge(e){
      if(e&&e.preventDefault)e.preventDefault();dodges++;
      no.textContent=lines[Math.min(dodges,lines.length-1)];
      yes.style.transform='scale('+Math.min(1+dodges*.18,2.4)+')';
      no.style.position='fixed';var w=no.offsetWidth,h=no.offsetHeight;
      no.style.left=Math.max(8,Math.random()*(innerWidth-w-16))+'px';
      no.style.top=Math.max(8,Math.random()*(innerHeight-h-16))+'px';
    }
    no.onpointerenter=dodge;no.ontouchstart=dodge;no.onclick=dodge;
    yes.onclick=function(){
      $('ask-wrap').classList.add('hide');$('done').classList.remove('hide');no.style.display='none';
      H.fast=true;H.big=true;rain();
      fall($('thanks'),'Yay, cảm ơn em!',2.2);fall($('who'),fin,3);
      if(preview){var b=document.createElement('button');b.className='ghost';b.textContent='Quay lại chỉnh sửa';b.style.marginTop='20px';b.onclick=function(){location.reload()};$('done').appendChild(b)}
    };
  }
  function rain(){
    var n=matchMedia('(prefers-reduced-motion:reduce)').matches?8:46;
    for(var i=0;i<n;i++){
      var h=document.createElement('span');h.className='heart';h.textContent='♥';
      h.style.left=Math.random()*100+'vw';h.style.fontSize=(16+Math.random()*30)+'px';
      h.style.setProperty('--d',(3+Math.random()*3)+'s');h.style.setProperty('--r',(Math.random()*80-40)+'deg');
      h.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(h);
      (function(x){setTimeout(function(){x.remove()},8000)})(h);
    }
  }
  if(location.hash.length>1){try{showLock(unpack(location.hash.slice(1)))}catch(e){}}
})();
</script>
</body>
</html>
